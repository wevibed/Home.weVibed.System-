name: Extract Home Website ZIP

on:
  push:
    paths:
      - "wevibed-home.zip"
      - ".github/workflows/extract-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="wevibed-home.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          fi

          mkdir -p /tmp/home-website
          unzip -o "$ZIP_FILE" -d /tmp/home-website

          SOURCE="/tmp/home-website"
          COUNT=$(find "$SOURCE" -mindepth 1 \
            -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ] && \
             [ -d "$(find "$SOURCE" -mindepth 1 \
             -maxdepth 1)" ]; then
            SOURCE=$(find "$SOURCE" -mindepth 1 \
              -maxdepth 1)
          fi

          cp -a "$SOURCE"/. .

          echo "Extracted website files:"
          ls -la

          if [ ! -f package.json ] && \
             [ ! -f index.html ]; then
            echo "ERROR: Website entry files not found."
            exit 1
          fi

      - name: Commit extracted files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/

          if ! git diff --cached --quiet; then
            git commit -m "Extract home website files"
            git push origin HEAD:main
          else
            echo "No new files to commit."
          fi
